# Experiment 2.3: D2F Architecture + Standard Training
# Tests D2F architecture without asymmetric distillation

# Training mode configuration
training_mode: 'dream'

# Model and data path configuration
paths:
  model: '/scratch/dannyliu/.cache/huggingface/hub/models--Dream-org--Dream-v0-Base-7B'
  experiment: './experiments/ablation'
  data:
    bs: 'Lansechen/bs17k_collection_filtered_hard_maxlength600'
    bs_easy: 'Lansechen/bs17k_collection_filtered_easy_maxlength600'

denoiser:
  encoder:
    name: 'dream'
    mask_id: 151666

  decoder:
    wiinit: true
    name: 'eagle_rope'
    num_blocks: 1
    seq_len: &seq_len 512
    input_dim: 3584
    hidden_dim: &dim 3584
    vocab_size: 152064
    block:
      seq_len: *seq_len
      hidden_dim: *dim
      num_heads: 32

train:
  decoder_resume_path:
  head_resume_path:
  skipped_keys:
  global_step:
  exp_name: &exp_name 'exp_2_3_d2f_standard_training'
  wandb_proj: 'ablation_study'
  output_dir: 'exp_2_3_d2f_standard_training'
  logging_dir: 'logs'
  mixed_precision: 'bf16'
  gradient_accumulation_steps: 4
  report_to: 'wandb'
  block_size: 16 
  
  lr: 5e-6
  num_iters: 50000
  eval_every: 1000
  save_every: 2000

  # D2F architecture but standard training
  enable_shift: true           # Enable logit shifting (D2F component)
  share_steps: 2              # Multi-step training (D2F component)
  self_align: false           # Disable asymmetric distillation (KEY DIFFERENCE)
  feature_align: false
  self_step: true

data:
  name: 'bs17k'
  batch_size: 2
  max_length: *seq_len
