# Experiment: Conservative Baseline (Original Dream Model)
# Ultra-conservative settings for debugging

# Training mode configuration
training_mode: 'dream'

# Model and data path configuration
paths:
  model: '/home/hice1/zdu89/scratch/dannyliu/.cache/huggingface/hub/models--Dream-org--Dream-v0-Base-7B/snapshots/6572adb5535263e4d1a337b56942ba48b6dee2a9'
  experiment: './experiments/ablation'
  data:
    bs: 'Lansechen/bs17k_collection_filtered_hard_maxlength600'
    bs_easy: 'Lansechen/bs17k_collection_filtered_easy_maxlength600'

denoiser:
  encoder:
    name: 'dream'
    mask_id: 151666

  decoder:
    wiinit: true
    name: 'eagle_rope'
    num_blocks: 1
    seq_len: &seq_len 128        # Much smaller sequence length for debugging
    input_dim: 3584
    hidden_dim: &dim 3584
    vocab_size: 152064
    block:
      seq_len: *seq_len
      hidden_dim: *dim
      num_heads: 32

train:
  decoder_resume_path:
  head_resume_path:
  skipped_keys:
  global_step:
  exp_name: &exp_name 'baseline_conservative_debug'
  wandb_proj: 'ablation_study'
  output_dir: 'baseline_conservative_debug'
  logging_dir: 'logs'
  mixed_precision: 'bf16'
  gradient_accumulation_steps: 16   # Higher accumulation
  report_to: 'no'                   # Disable wandb for debugging
  block_size: 8                     # Smaller block size
  
  lr: 5e-6
  num_iters: 1000                   # Shorter run for testing
  eval_every: 500                   # Less frequent evaluation
  save_every: 500                   # Frequent saves for debugging

  # Standard training (no D2F components)
  enable_shift: false               # Disable logit shifting
  share_steps: 2                   # Use 2 steps (required for loss function)
  self_align: false                # No asymmetric distillation
  feature_align: false
  self_step: false

data:
  name: 'bs17k'
  batch_size: 1                     # Minimal batch size
  max_length: *seq_len
