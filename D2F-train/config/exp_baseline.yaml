# Experiment: Baseline (Original Dream Model)
# This serves as the baseline for all ablation studies

# Training mode configuration
training_mode: 'dream'

# Model and data path configuration
paths:
  model: '/scratch/dannyliu/.cache/huggingface/hub/models--Dream-org--Dream-v0-Base-7B'
  experiment: './experiments/ablation'
  data:
    bs: 'Lansechen/bs17k_collection_filtered_hard_maxlength600'
    bs_easy: 'Lansechen/bs17k_collection_filtered_easy_maxlength600'

denoiser:
  encoder:
    name: 'dream'
    mask_id: 151666

  decoder:
    wiinit: true
    name: 'eagle_rope'
    num_blocks: 1
    seq_len: &seq_len 512
    input_dim: 3584
    hidden_dim: &dim 3584
    vocab_size: 152064
    block:
      seq_len: *seq_len
      hidden_dim: *dim
      num_heads: 32

train:
  decoder_resume_path:
  head_resume_path:
  skipped_keys:
  global_step:
  exp_name: &exp_name 'baseline_original_dream'
  wandb_proj: 'ablation_study'
  output_dir: 'baseline_original_dream'
  logging_dir: 'logs'
  mixed_precision: 'bf16'
  gradient_accumulation_steps: 4
  report_to: 'wandb'
  block_size: 16 
  
  lr: 5e-6
  num_iters: 50000
  eval_every: 1000
  save_every: 2000

  # Standard training (no D2F components)
  enable_shift: false           # Disable logit shifting
  share_steps: 1               # Single step training
  self_align: false            # No asymmetric distillation
  feature_align: false
  self_step: false

data:
  name: 'bs17k'
  batch_size: 2
  max_length: *seq_len
